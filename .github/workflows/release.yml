# 推送版本 tag（v*）时自动构建全平台产物并发布 GitHub Release。
#
# 矩阵与 build.ps1 保持一致：
#   windows-386 / windows-amd64 / windows-arm64
#   linux-386 / linux-amd64 / linux-armv7 / linux-arm64
#   darwin-amd64 / darwin-arm64
# 构建前先跑 go vet + go test：测试不过就不发布，避免发出坏产物。
#
# 权限最小化：默认 workflow 权限为 read，发布 Release 需要显式授予 contents: write。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 先验证，再构建：测试失败时构建作业根本不会启动。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: windows, goarch: '386', suffix: windows-386, ext: '.exe' }
          - { goos: windows, goarch: amd64, suffix: windows-amd64, ext: '.exe' }
          - { goos: windows, goarch: arm64, suffix: windows-arm64, ext: '.exe' }
          - { goos: linux, goarch: '386', suffix: linux-386, ext: '' }
          - { goos: linux, goarch: amd64, suffix: linux-amd64, ext: '' }
          - { goos: linux, goarch: arm, goarm: '7', suffix: linux-armv7, ext: '' }
          - { goos: linux, goarch: arm64, suffix: linux-arm64, ext: '' }
          - { goos: darwin, goarch: amd64, suffix: darwin-amd64, ext: '' }
          - { goos: darwin, goarch: arm64, suffix: darwin-arm64, ext: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          out="workbuddy-gateway-${{ matrix.suffix }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "$out" .
          sha256sum "$out" > "$out.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: workbuddy-gateway-${{ matrix.suffix }}
          path: |
            workbuddy-gateway-${{ matrix.suffix }}${{ matrix.ext }}
            workbuddy-gateway-${{ matrix.suffix }}${{ matrix.ext }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 生成完整变更日志需要完整历史

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate consolidated checksums
        run: |
          cd dist
          files=$(ls workbuddy-gateway-* | grep -v '\.sha256$')
          sha256sum $files > SHA256SUMS

      - name: List release assets
        run: ls -la dist/

      # 版本号取自 tag（v1.15.0 -> 1.15.0），并与 main.go 的 version 常量校验一致。
      # 不一致说明发版流程漏了 bump，直接失败而不是发出名实不符的产物。
      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src=$(grep -oP 'version\s*=\s*"\K[^"]+' main.go | head -1)
          echo "tag=$tag source=$src"
          if [ "$tag" != "$src" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 main.go 的 version ($src) 不一致，请先 bump 版本号"
            exit 1
          fi

      - name: Generate release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          # 上一个 tag 到本 tag 之间的提交，作为 Release 说明的变更列表。
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || echo "")
          {
            echo "## WorkBuddy Local Gateway ${tag}"
            echo
            echo "### 产物"
            echo
            echo "| 文件 | 平台 |"
            echo "|---|---|"
            echo "| \`workbuddy-gateway-windows-386.exe\` | Windows x86 |"
            echo "| \`workbuddy-gateway-windows-amd64.exe\` | Windows x86_64 |"
            echo "| \`workbuddy-gateway-windows-arm64.exe\` | Windows ARM64 |"
            echo "| \`workbuddy-gateway-linux-386\` | Linux x86 |"
            echo "| \`workbuddy-gateway-linux-amd64\` | Linux x86_64 |"
            echo "| \`workbuddy-gateway-linux-armv7\` | Linux ARMv7 |"
            echo "| \`workbuddy-gateway-linux-arm64\` | Linux ARM64 |"
            echo "| \`workbuddy-gateway-darwin-amd64\` | macOS x86_64 |"
            echo "| \`workbuddy-gateway-darwin-arm64\` | macOS ARM64 |"
            echo
            echo "均为静态链接单二进制（CGO 关闭），下载后 \`chmod +x\` 即可运行；校验见同名 \`.sha256\` 或 \`SHA256SUMS\`。"
            echo
            echo "### 变更"
            echo
            if [ -n "$prev" ]; then
              echo "自 \`${prev}\` 以来的提交："
              echo
              git log --no-merges --pretty='- %s' "${prev}..${tag}"
            else
              git log --no-merges --pretty='- %s' "${tag}"
            fi
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "WorkBuddy Local Gateway ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/*
